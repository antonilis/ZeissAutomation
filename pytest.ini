[pytest]
# Tests live in tests/. The rest of the repository is never collected, so the hand-run
# `if __name__ == '__main__':` smoke tests in the production modules are left alone.
testpaths = tests

# The project root holds an __init__.py, which makes the default "prepend" import mode
# name test modules after the folder above the repository. importlib mode imports each
# test file on its own and leaves sys.path to the line below.
addopts = --import-mode=importlib -ra

# "."        - World B imports from the project root (data_processing..., IO..., utils),
#              exactly as PYTHONPATH is set by PythonAnalysisRunner.
# "ZeissAPI" - World A imports zen_lib.<module>, exactly as ZEN sees it.
# "tests/support" - the fakes of System.*, clr and Zeiss.* and the shared helpers.
pythonpath = . ZeissAPI tests/support

markers =
    data: needs real .czi files; set ZEISS_TEST_DATA to the folder holding them, skipped otherwise
    slow: takes more than a few seconds

xfail_strict = true
